name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Verify maintained constants agree
        run: python3 scripts/update-constants.py --check --format json
      - name: Exercise constant update and recovery
        run: python3 -m unittest discover -s tests -p test_update_constants.py -v
