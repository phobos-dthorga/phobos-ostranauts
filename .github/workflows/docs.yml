name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Check native mod loader directories
        run: python3 scripts/check-mod-layout.py
      - name: Verify reviewed English coverage and formatting contracts
        run: python3 scripts/audit-player-language.py
      - name: Exercise native layout checks
        run: python3 -m unittest discover -s tests -p test_mod_layout.py
      - name: Verify maintained constants agree
        run: python3 scripts/update-constants.py --check --format json
      - name: Exercise constant update and recovery
        run: python3 -m unittest discover -s tests -p test_update_constants.py -v
      - name: Check Workshop pages and generated release notes
        run: python3 scripts/workshop-release-notes.py --check --format json
      - name: Require publication records alongside changed mod content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/workshop-release-notes.py --check --base "$BASE_SHA" --format json
          fi
      - name: Exercise Workshop release-note generation
        run: python3 -m unittest discover -s tests -p test_workshop_release_notes.py -v
      - name: Exercise offline Workshop preparation
        run: python3 -m unittest discover -s tests -p test_workshop_preparation.py -v
      - name: Check item reference coverage and source freshness
        run: |
          python3 scripts/update-item-reference.py --check
          python3 scripts/audit-item-handling.py --check
      - name: Exercise item reference failure and check-only cases
        run: python3 -m unittest discover -s tests -p test_item_reference.py -v
      - name: Verify the performance review ledger covers every source file at its current hash
        run: python3 scripts/audit-performance.py
      - name: Verify bulk-storage research calculations and source freshness
        run: python3 -m unittest discover -s tests -p test_agriculture_storage.py -v
      - name: Exercise remaining offline maintenance checks
        run: |
          for suite in test_agriculture_budget test_compare_performance test_documentation_packaging test_item_action_audit test_performance_audit test_player_language test_salvage_inspection; do
            python3 -m unittest discover -s tests -p "$suite.py" -v
          done
