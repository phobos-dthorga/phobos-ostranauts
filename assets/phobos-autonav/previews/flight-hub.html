<!doctype html><html lang="en"><meta charset="utf-8"><title>Polaris Flight Hub layout proof</title>
<style>
*{box-sizing:border-box}body{margin:24px;background:#101519;color:#d1dadb;font:14px Arial,sans-serif}h1{font-size:20px}p{max-width:750px}select,button{font:inherit}#panel{position:relative;width:600px;height:960px;transform-origin:top left;background:linear-gradient(120deg,#34424d,#242e37);border-radius:12px;box-shadow:inset 0 0 0 8px #45535f,inset 0 0 0 13px #15212b;overflow:hidden}.art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.box{position:absolute}.label{font-size:24px;line-height:1.12;white-space:pre-line;display:flex;align-items:center;overflow:hidden;padding:0;color:#d1dadb}.clip{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;align-content:center}.button{position:absolute;border:2px solid #10171d;border-radius:7px;background:linear-gradient(#45515d,#29353f);box-shadow:inset 0 0 0 2px #53616c;color:#d1dadb;display:flex;justify-content:center;align-items:center;text-align:center;line-height:1.1;padding:2px 6px;font-size:24px;white-space:pre-line}.button.active{border-color:#b99558}.guard{background:repeating-linear-gradient(135deg,#c7a84a 0 8px,#24292b 8px 16px);border:3px solid #12191c;padding:8px}.guard:after{content:"";display:block;width:100%;height:100%;border:4px ridge #647080;background:linear-gradient(#df5b3e,#7a2924 35%,#232d33 36%,#141b20);border-radius:3px}.slider{border:3px ridge #49535e;background:linear-gradient(90deg,#35414a 20%,#13181d 22%,#0c1115 70%,#a6adb1 71%,#2b333a 76%)}.slider:after{content:"";position:absolute;left:0;top:45%;width:100%;height:18px;border:3px ridge #77818a;background:#3d454c}.dial{border:4px ridge #77818a;border-radius:50%;background:linear-gradient(45deg,#12191c,#444f58);display:grid;place-items:center;font-size:28px}#frame{width:600px;height:960px}.details{overflow:auto;white-space:pre-line;font-size:24px;line-height:1.2;padding:8px}.muted{color:#a8b6bc}
.readout{background:#0c1317;box-shadow:inset 0 0 0 2px #56646d}.one-line{display:block;white-space:nowrap;text-overflow:ellipsis;line-height:28px}.centred{justify-content:center;text-align:center}
.button.compact{border:0;background:transparent;box-shadow:none;padding:0}.tab-face{left:2px;right:2px;top:6px;bottom:6px;pointer-events:none}
.label,.button{white-space:pre}.clip{display:flex}.label.prose{white-space:pre-line}.weapon-card{display:block;white-space:pre;line-height:26px;text-overflow:ellipsis}

.button{font-size:20px;border-color:#7f939d;background:#364551;box-shadow:inset 0 1px 0 #9caeb5;color:#c9d4cf}
.button:hover{background:#445663}.button:active{background:#1d2a35}.button:disabled{background:#242c33}[data-box="actions"]{background:#2b3741}.button.active{border-bottom:4px solid #eac466;color:#eac466;font-weight:bold}
[data-box="tabs"]{background:#2b3741}.tab-face{top:0;bottom:0}.dialog{position:absolute;inset:8px 24px 8px 8px;background:#131d24;padding:4px 4px 8px;overflow-y:scroll;overflow-x:hidden;scrollbar-width:none;font-size:20px;line-height:1.2}.dialog::-webkit-scrollbar{width:0}.scroll-rail{position:absolute;right:8px;top:8px;bottom:8px;width:12px;background:#1f262b}.scroll-thumb{position:absolute;left:0;width:100%;background:#99afbb}.dialog::-webkit-scrollbar-track{background:#1f262b}.dialog::-webkit-scrollbar-thumb{background:#99afbb}.dialog p{margin:8px 4px;white-space:pre-line}.live-frame{position:absolute;border:2px solid #56646d;background:#2b3741;pointer-events:none}.live-frame[data-zone="header"],.live-frame[data-zone="coast"]{background:#0c1317}.dialog h2{font-size:26px;color:#eac466}.dialog button{justify-content:flex-start;padding-left:10px;padding-right:10px;position:relative;display:block;width:100%;min-height:40px;margin:0 0 8px}
</style>
<h1>Polaris flight hub • layout proof</h1><p>Offline layout and typography only. Vanilla controls are represented schematically; this is not a Unity or gameplay capture. All positions use the same registration file as the game panel.</p>
<p><select id="size"><option>300</option><option>400</option><option selected>600</option></select> <select id="page"><option>navigation</option><option>pursuit</option><option>fire</option><option>systems</option><option>docking</option><option>departure</option><option>details</option><option>groups</option><option>handoff</option><option>warning</option></select> <label><input type="checkbox" id="expanded"> Expanded labels / long target names</label></p><div id="frame"><div id="panel"></div></div>
<script>
let layout,catalog,boxes;const panel=document.querySelector('#panel');
const fmt=(s,...args)=>s.replace(/\{(\d+)(?::[^}]+)?\}/g,(_,n)=>args[+n]??'—');
function t(key,...args){let s=fmt(catalog['Hub.'+key]||catalog[key]||key,...args);if(document.querySelector('#expanded').checked&&!['title','metrics','system_metrics','coast','help'].includes(key))s=s.replace(/[A-Za-z]{5,}/g,w=>w+'··');return s;}
function box(parent,id){const b=boxes[id],e=document.createElement('div');e.className='box';e.dataset.box=id;Object.assign(e.style,{left:b.x+'px',top:b.y+'px',width:b.w+'px',height:b.h+'px'});parent.append(e);return e;}
function label(parent,text,extra=''){const e=document.createElement('div');e.className='label '+extra;e.style.width=e.style.height='100%';e.textContent=text;parent.append(e);return e;}
function readout(parent,text,size=24,pad=6,extra=''){parent.classList.add('readout');parent.dataset.field=true;const e=label(parent,text,extra);Object.assign(e.style,{position:'absolute',left:'12px',right:'12px',top:pad+'px',bottom:pad+'px',width:'auto',height:'auto',fontSize:size+'px'});return e;}
function btn(parent,text,x,y,w,h,critical=true){const e=document.createElement('button');e.className='button';e.textContent=text;Object.assign(e.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});e.dataset.critical=critical;if(false){e.classList.add('compact');e.textContent='';const face=document.createElement('span');face.className='button tab-face';face.textContent=text;e.append(face);}parent.append(e);return e;}
function cells(parent,items,fn){const w=(parent.clientWidth-(items.length-1)*8)/items.length;items.forEach((item,i)=>{const e=btn(parent,t(item),i*(w+8),0,w,parent.clientHeight);if(fn)e.onclick=()=>fn(item);});}
function setting(parent,id,key,value){const r=box(parent,id),field=document.createElement('div');Object.assign(field.style,{position:'absolute',width:'344px',height:'56px'});r.append(field);readout(field,t(key,value),24,2);btn(r,'-',356,0,80,56);btn(r,'+',448,0,80,56);}
function decorate(parent,id,type){const e=box(parent,id);e.classList.add(type);e.dataset.control=true;return e;}
function render(){panel.replaceChildren();const width=+document.querySelector('#size').value;panel.style.transform=`scale(${width/600})`;const frame=document.querySelector('#frame');frame.style.width=width+'px';frame.style.height=width*1.6+'px';let page=document.querySelector('#page').value;
 const art=document.createElement('img');art.className='art';art.src='../../../mods/PhobosAutoNav/images/phobos/autonav/PhobosFlightHub.png';art.onerror=()=>art.remove();panel.append(art);
 const plate=document.createElement('div');Object.assign(plate.style,{position:'absolute',left:'24px',top:'52px',width:'552px',height:'896px',background:'#2b3741'});panel.append(plate);for(const z of layout.zones.filter(z=>z.id!=='title')){const f=document.createElement('div');f.className='live-frame';f.dataset.zone=z.id;Object.assign(f.style,{left:z.x+'px',top:z.y+'px',width:z.w+'px',height:z.h+'px'});panel.append(f);}
 const long=document.querySelector('#expanded').checked,target=long?'Definitely Nurture — Interplanetary Logistics Courier Alpha Seven':'Definitely Nurture',fire=long?'Independent Salvage Vessel — Forgotten Virtue Beta Nine':'Forgotten Virtue';
 label(box(panel,'title'),t('title')).style.fontSize='26px';label(box(panel,'target'),t('nav_target',target),'clip');label(box(panel,'offensive'),page==='fire'?t('offensive_target',fire):t('n2_ready'),'clip');
 label(box(panel,'operation'),page==='docking'?t('operation.Hold'):page==='pursuit'?'FOLLOWING • FIRE HELD':'READY','one-line');label(box(panel,'contact'),t('FCS.contacts',t('FCS.contact.Ready'),page==='fire'?t('FCS.contact.Ready'):t('FCS.contact.Unavailable')),'one-line');label(box(panel,'restriction'),page==='docking'?'Holding separation until target manoeuvres settle':page==='pursuit'?'Braking priority • weapons held':'Select a flight action below','one-line').style.color='#eac466';
 const tabs=box(panel,'tabs');['navigation','pursuit','fire','systems','departure','details'].forEach((name,i)=>{const b=btn(tabs,t(name),(i%3)*176,Math.floor(i/3)*46,168,40);if(page===name)b.classList.add('active');b.onclick=()=>{document.querySelector('#page').value=name;render()};});
 const more=box(panel,'warningDetails');btn(more,t('more'),0,0,more.clientWidth,more.clientHeight);
 let body=box(panel,'body');if(['departure','details','groups','handoff','warning'].includes(page)){const viewport=document.createElement('div');viewport.className='dialog';body.append(viewport);body=viewport;}
 if(page==='navigation'||page==='docking'){
  cells(box(body,'nav.actions'),['approach','dock','approachdock']);readout(box(body,'nav.metrics'),page==='docking'?t('metrics','1.30','+0.0','0.1'):t('metrics','575.20','+1,402.0','1,496.6'),26);
  if(page==='navigation'){
   const p=box(body,'nav.propulsion');const f=document.createElement('div');Object.assign(f.style,{position:'absolute',width:'320px',height:'52px'});p.append(f);readout(f,t('propulsion',t('auto')));const dial=document.createElement('div');dial.className='box dial';Object.assign(dial.style,{left:'332px',top:'0px',width:'64px',height:'52px'});dial.textContent='╱';p.append(dial);btn(p,t('change'),408,0,120,52);
   setting(body,'nav.cruise','cruise_value','1,500');setting(body,'nav.arrival','arrival_value','0');setting(body,'nav.separation','separation_value','1');
  }else{readout(box(body,'dock.clearance'),t('clearance_valid'),24,4);readout(box(body,'dock.ports'),t('ports','PORT-A3','PORT-B7'),24,4);readout(box(body,'dock.alignment'),t('alignment','+0.03'),24,4);readout(box(body,'dock.progress'),t('progress.Hold'),24,4);}
 }else if(page==='pursuit'){
  cells(box(body,'pursuit.actions'),['rendezvous','follow']);setting(body,'pursuit.cruise','cruise_value','1,500');setting(body,'pursuit.separation','separation_value','1');readout(box(body,'pursuit.help'),t('FCS.pursuit_help'),24,6,'prose');
 }else if(page==='fire'){
  for(const [id,key,args]of [['target','select_fire_target',[]],['group','group',[2]],['volleys','FCS.volleys_hint',[1]],['native','FCS.return_native',[]],['aim','FCS.auto_aim',['OFF']],['reference','FCS.use_aim',[]],['weapon','FCS.weapon',[1,long?4:1,'—']]]){const b=box(body,'fire.'+id);btn(b,t(key,...args),0,0,b.clientWidth,b.clientHeight);}
  readout(box(body,'fire.card'),long?t('FCS.weapon_card','Long named kinetic weapon Alpha Seven',t('FCS.ready'),'YES','YES','0.0','0.0',t('FCS.mode_auto')):t('FCS.inventory_status','Artemis Launcher',t('FCS.switched_off')),24,2,'weapon-card');
  readout(box(body,'fire.ownership'),t('FCS.ownership',t('FCS.state.Hold'),0),24,2);label(box(body,'fire.engage'),t('FCS.engage'));decorate(body,'fire.guard','guard');readout(box(body,'fire.ready'),t('FCS.inventory_ready',t('FCS.hold'),long?2:0,long?4:1),24,2);
 }else if(page==='systems'){
  readout(box(body,'systems.metrics'),t('system_metrics','0.021','2,787.9','9.810','6.53','445.2','11.0','OFF'));
  for(const id of ['flow','cycle','safety','cycleEnable'])label(box(body,'systems.'+id+'Label'),t(id),'centred');
  for(const id of ['flow','cycle']){decorate(body,'systems.'+id,'slider');readout(box(body,'systems.'+id+'Value'),id==='flow'?'20 %':'50 %',24,2,'centred');}
  for(const id of ['safety','cycleEnable'])decorate(body,'systems.'+id,'guard');readout(box(body,'systems.safetyValue'),'ON',24,2,'centred');readout(box(body,'systems.enabledValue'),'OFF',24,2,'centred');const s=box(body,'systems.shutdown');btn(s,t('shutdown'),0,0,s.clientWidth,s.clientHeight);
 }else if(page==='departure'){
  body.classList.add('dialog');for(const key of ['depart-mode','depart','depart-continue','depart-resume','depart-stop']){const b=btn(body,t('Departure.'+key),0,0,body.clientWidth-8,40);b.style.position='relative';}
  const help=document.createElement('p');help.textContent=t('Departure.mode_fly')+'\n'+t('Departure.help');body.append(help);
 }else if(['groups','handoff','warning'].includes(page)){
  body.classList.add('dialog');const title=document.createElement('h2');title.textContent=t(page==='groups'?'FCS.choose_group':page==='handoff'?'FCS.change_group':'warning_details');body.append(title);
  btn(body,t('close_details'),0,0,body.clientWidth-8,40);
  if(page==='groups')for(let g=1;g<=3;g++){const b=btn(body,t('FCS.group_entry',g,1),0,0,body.clientWidth-8,40);if(g===2){b.classList.add('active');b.disabled=true;}}
  else{const p=document.createElement('p');p.textContent=page==='handoff'?t('FCS.handoff',1,2):'RCS detour around Deimos. Weapon-facing authority is held while braking and clearance take priority. This full explanation is available without clipping.';body.append(p);if(page==='handoff')btn(body,t('FCS.confirm_handoff'),0,0,body.clientWidth-8,40);}
 }else{body.classList.add('dialog');for(const caption of [t('Cue.watch'),'Crew settings',t('Cue.unwatch'),'Completion sound: 50%'])btn(body,caption,0,0,body.clientWidth-8,40);const help=document.createElement('p');help.textContent=t('help');body.append(help);}

 const viewport=panel.querySelector('.dialog');if(viewport){const rail=document.createElement('div'),thumb=document.createElement('div');rail.className='scroll-rail';thumb.className='scroll-thumb';rail.append(thumb);viewport.parentElement.append(rail);const update=()=>{const extent=viewport.scrollHeight-viewport.clientHeight;const height=Math.max(18,rail.clientHeight*viewport.clientHeight/viewport.scrollHeight);thumb.style.height=height+'px';thumb.style.top=(extent?viewport.scrollTop/extent*(rail.clientHeight-height):0)+'px';};viewport.addEventListener('scroll',update);const move=e=>{const r=rail.getBoundingClientRect();viewport.scrollTop=(e.clientY-r.top)/r.height*(viewport.scrollHeight-viewport.clientHeight);};rail.onpointerdown=e=>{rail.setPointerCapture(e.pointerId);move(e);};rail.onpointermove=e=>{if(rail.hasPointerCapture(e.pointerId))move(e);};update();}
 cells(box(panel,'actions'),['resume','disengage','cease']);label(box(panel,'coast'),t('coast')).style.fontSize='20px';
}
window.ready=Promise.all([fetch('../hub-layout.json').then(r=>r.json()),fetch('../../../translations/PhobosAutoNav/en.json').then(r=>r.json())]).then(([a,b])=>{layout=a;catalog=b;boxes=Object.fromEntries(a.boxes.map(v=>[v.id,v]));render();for(const id of ['size','page','expanded'])document.getElementById(id).onchange=render;});
</script></html>
